{% extends 'base.html' %}

{% block title %}{{ page.seo_title|default:page.title }} | {{ site_settings.store_name }}{% endblock %}
{% block meta_description %}{{ page.seo_description|default:page.title }}{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="bg-white rounded-3xl border border-stone-200 p-8 sm:p-12 shadow-sm">
        <h1 class="text-3xl sm:text-4xl font-serif font-bold text-navy mb-8 border-b border-stone-100 pb-4">
            {{ page.title }}
        </h1>
        <div class="prose max-w-none text-stone-700 text-sm leading-relaxed space-y-4">
            {{ page.content|safe }}
        </div>
    </div>
</div>
{% endblock %}
