<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="340" height="70" fill="none">
    <defs>
        <linearGradient id="headerNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0F172A" />
            <stop offset="50%" stop-color="#1E293B" />
            <stop offset="100%" stop-color="#162032" />
        </linearGradient>

        <linearGradient id="headerGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F9E7BA" />
            <stop offset="40%" stop-color="#E2B874" />
            <stop offset="70%" stop-color="#C59B4B" />
            <stop offset="100%" stop-color="#E9C886" />
        </linearGradient>

        <linearGradient id="headerPetalWing" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
            <stop offset="100%" stop-color="#EAD1B0" stop-opacity="0.75" />
        </linearGradient>

        <filter id="headerDrop" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.18" />
        </filter>
    </defs>

    <!-- LEFT: EMBLEM BADGE (54x54) -->
    <g transform="translate(4, 8)">
        <!-- Outer Badge -->
        <rect x="0" y="0" width="54" height="54" rx="14" fill="url(#headerNavyGrad)" stroke="url(#headerGoldGrad)" stroke-width="1.2" stroke-opacity="0.5" />
        <rect x="2" y="2" width="50" height="50" rx="12" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.15" />

        <!-- Scaled Orchid Bloom inside Badge -->
        <g transform="translate(27, 27) scale(0.48) translate(-60, -58)">
            <!-- Top Petal -->
            <path d="M60 25 C66 33 68 43 60 52 C52 43 54 33 60 25 Z" fill="url(#headerGoldGrad)" />
            <path d="M60 27 C64.5 33.5 65.5 41 60 48 C54.5 41 55.5 33.5 60 27 Z" fill="#FFFFFF" opacity="0.9" />

            <!-- Left Wing Petal -->
            <path d="M57 51 C45 39 31 43 27 55 C24 65 37 71 52 59 C54 57 56 54 57 51 Z" fill="url(#headerPetalWing)" />
            <path d="M57 51 C45 39 31 43 27 55 C24 65 37 71 52 59" stroke="url(#headerGoldGrad)" stroke-width="1.4" stroke-linecap="round" fill="none" />

            <!-- Right Wing Petal -->
            <path d="M63 51 C75 39 89 43 93 55 C96 65 83 71 68 59 C66 57 64 54 63 51 Z" fill="url(#headerPetalWing)" />
            <path d="M63 51 C75 39 89 43 93 55 C96 65 83 71 68 59" stroke="url(#headerGoldGrad)" stroke-width="1.4" stroke-linecap="round" fill="none" />

            <!-- Lower Sepals -->
            <path d="M53 60 C40 68 36 79 43 86 C48 91 55 86 57 70 Z" fill="url(#headerGoldGrad)" opacity="0.9" />
            <path d="M67 60 C80 68 84 79 77 86 C72 91 65 86 63 70 Z" fill="url(#headerGoldGrad)" opacity="0.9" />

            <!-- Labellum Center -->
            <path d="M60 52 C54 57 52 66 60 74 C68 66 66 57 60 52 Z" fill="url(#headerGoldGrad)" />
            <polygon points="60,56 62.5,61 60,66 57.5,61" fill="#FFFFFF" />
            <circle cx="60" cy="61" r="1.3" fill="#C25E38" />
        </g>
    </g>

    <!-- RIGHT: TYPOGRAPHY -->
    <g transform="translate(68, 12)">
        <!-- Wordmark: BeddingOrchid -->
        <text x="0" y="32" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" letter-spacing="-0.3">
            <tspan fill="#1E293B">Bedding</tspan><tspan fill="#C25E38">Orchid</tspan>
        </text>

        <!-- Subtitle / Byline -->
        <text x="1" y="47" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8.5" font-weight="600" fill="#78716C" letter-spacing="2.6">
            LUXURY HOME TEXTILES • PAKISTAN
        </text>
    </g>
</svg>