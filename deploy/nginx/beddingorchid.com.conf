# ==============================================================================
# Nginx Virtual Host Configuration for BeddingOrchid (6th Site on Shared VPS)
# Domain: beddingorchid.com & www.beddingorchid.com
# Socket: unix:/run/beddingorchid.sock (Prevents port conflicts with other 5 sites)
# ==============================================================================

upstream beddingorchid_app {
    server unix:/run/beddingorchid.sock fail_timeout=0;
}

# Redirect www to non-www (or vice-versa according to your preference)
server {
    listen 80;
    listen [::]:80;
    server_name www.beddingorchid.com;
    return 301 http://beddingorchid.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name beddingorchid.com;

    client_max_body_size 35M;
    charset utf-8;

    # Access and Error Logs
    access_log /var/log/nginx/beddingorchid.access.log combined;
    error_log  /var/log/nginx/beddingorchid.error.log warn;

    # Gzip Compression for Fast Page Loads
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static Files (Collected by WhiteNoise / Django collectstatic)
    location /static/ {
        alias /var/www/beddingorchid/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Media Files (Product photos, banners uploaded via admin)
    location /media/ {
        alias /var/www/beddingorchid/media/;
        expires 14d;
        add_header Cache-Control "public, max-age=1209600";
        access_log off;
    }

    # Favicon & Robots.txt
    location = /favicon.ico {
        alias /var/www/beddingorchid/staticfiles/favicon.ico;
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        alias /var/www/beddingorchid/staticfiles/robots.txt;
        access_log off;
        log_not_found off;
    }

    # Dynamic Django Application Proxy
    location / {
        proxy_pass http://beddingorchid_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_redirect off;
    }
}

